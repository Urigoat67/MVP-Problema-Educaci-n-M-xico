# Foundathyon Deploy: https://mvp-problema-educaci-n-m-xico-gophers.foundathyon.dev
# Needs the repository secret FOUNDATHYON_REGISTRY_TOKEN (Settings > Secrets and variables > Actions)
# with the fdr_... token of the service. Configuring the service from the panel installs both.
name: "Foundathyon Deploy (mvp-problema-educaci-n-m-xico-gophers)"

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: "foundathyon-deploy-mvp-problema-educaci-n-m-xico-gophers"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: fundathyon/deploy-action@v1
        with:
          organization: "gophers"
          service: "mvp-problema-educaci-n-m-xico"
          token: ${{ secrets.FOUNDATHYON_REGISTRY_TOKEN }}
          registry: "registry.foundathyon.dev"
          url: "https://mvp-problema-educaci-n-m-xico-gophers.foundathyon.dev"
